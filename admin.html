<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel do Blog | Garimpando Life</title><link rel="icon" type="image/png" href="images/favicon.png"><link rel="apple-touch-icon" href="images/favicon.png"><link rel="stylesheet" href="admin.css?v=20260904-8"></head>
<body class="locked">
<section id="loginGate" class="login-gate"><form id="loginForm" class="login-card"><img src="images/logo.png" alt="Garimpando Life"><small>ÁREA RESTRITA</small><h1>Acesso ao painel</h1><p>Entre com o usuário administrador cadastrado no Supabase.</p><label>E-mail<input id="adminEmail" type="email" autocomplete="username" required autofocus placeholder="seu@email.com"></label><label>Senha<input id="adminPassword" type="password" autocomplete="current-password" required placeholder="Digite sua senha"></label><span id="loginError" role="alert"></span><button type="submit">Entrar no painel</button><a href="index.html#inicio">← Voltar para o site</a></form></section>
<header class="top"><a href="index.html#inicio"><img src="images/logo.png" alt="Garimpando Life"></a><div><span>Painel do Blog</span><a class="site-link" href="index.html#blog">Ver blog ↗</a><button id="logoutBtn" class="logout">Sair</button></div></header>
<main>
  <aside class="side"><button class="primary" id="newPost">＋ Nova matéria</button><button id="showPosts">▤ Minhas matérias</button><button id="exportBtn">⇩ Fazer backup</button><label class="import">⇧ Restaurar backup<input id="importFile" type="file" accept="application/json"></label><p>As matérias ficam salvas neste navegador. Faça backup regularmente.</p></aside>
  <section class="workspace">
    <div id="editor" class="panel">
      <div class="heading"><div><small>PUBLICAÇÃO</small><h1 id="editorTitle">Nova matéria</h1></div><span id="saveState">Não salva</span></div>
      <form id="postForm">
        <input type="hidden" id="postId">
        <label class="wide">Título da matéria<input id="title" required maxlength="180" placeholder="Digite um título interessante"></label>
        <div class="row"><label>Destino da matéria<select id="category" required></select><small class="field-help" id="categoryDestination">A matéria aparecerá na categoria selecionada.</small></label><label>Data<input id="date" type="date" required></label></div>
        <label class="cover-option"><input id="featured" type="checkbox"><span><b>Destacar na capa do site</b><small>Quando ativado, esta matéria será exibida no banner principal da página inicial.</small></span></label>
        <label class="wide">Resumo<textarea id="excerpt" maxlength="450" required placeholder="Um resumo curto que aparecerá na página do blog"></textarea><small><span id="excerptCount">0</span>/450</small></label>
        <label class="wide">Imagem de capa<div class="image-tools"><input id="imageUrl" type="url" placeholder="Cole o endereço de uma imagem"><span>ou</span><label class="upload">Escolher imagem<input id="imageFile" type="file" accept="image/*"></label></div><div id="imagePreview" class="image-preview"><span>Nenhuma imagem selecionada</span></div></label>
        <label class="wide">Fotos adicionais da matéria<small class="gallery-help">Escolha várias fotos de uma vez. Elas serão exibidas em uma galeria abaixo do texto.</small><label class="upload gallery-upload">＋ Escolher várias fotos<input id="galleryFiles" type="file" accept="image/*" multiple></label><div id="galleryPreview" class="gallery-preview"><span>Nenhuma foto adicional selecionada</span></div></label>
        <label class="wide">Conteúdo da matéria<div class="toolbar"><button type="button" data-tag="h2">Título</button><button type="button" data-tag="strong"><b>Negrito</b></button><button type="button" data-tag="em"><i>Itálico</i></button><button type="button" data-tag="a">Link</button></div><textarea id="body" class="body" required placeholder="Escreva o conteúdo completo da matéria aqui..."></textarea></label>
        <div class="actions"><button type="button" id="previewBtn">Visualizar</button><button class="primary" type="submit">Publicar matéria</button></div>
      </form>
    </div>
    <div id="postList" class="panel hidden"><div class="heading"><div><small>CONTEÚDO LOCAL</small><h1>Minhas matérias</h1></div><b id="postCount">0 matérias</b></div><div id="items"></div></div>
  </section>
</main>
<dialog id="preview"><button class="close" id="closePreview">×</button><article><img id="previewImage"><small id="previewCategory"></small><h1 id="previewTitle"></h1><p id="previewExcerpt"></p><div id="previewBody"></div></article></dialog>
<div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="content.js?v=20260904-2"></script><script src="admin.js?v=20260904-8"></script>
</body></html>
