  <script id="iphone-carousel-script">(()=>{const mobile=matchMedia('(max-width:900px),(pointer:coarse)'),force=new URLSearchParams(location.search).has('iphone-carousel-test');function setup(carousel){if((!mobile.matches&&!force)||carousel.dataset.iphoneFixed)return;const track=carousel.querySelector('.companies-track'),cards=[...carousel.querySelectorAll('.company-card')],previous=carousel.querySelector('.company-previous'),next=carousel.querySelector('.company-next');if(!track||!cards.length)return;carousel.dataset.iphoneFixed='true';carousel.classList.add('iphone-carousel-fixed');Object.assign(track.style,{display:'block',overflow:'hidden',scrollSnapType:'none',touchAction:'pan-y'});let current=Math.max(0,cards.findIndex(card=>card.classList.contains('company-active')));const show=index=>{current=(index+cards.length)%cards.length;cards.forEach((card,cardIndex)=>{const active=cardIndex===current;card.classList.toggle('company-active',active);card.setAttribute('aria-hidden',String(!active));Object.assign(card.style,{display:active?'flex':'none',width:'100%',minWidth:'100%',maxWidth:'100%',margin:'0'})})};previous.onclick=()=>show(current-1);next.onclick=()=>show(current+1);show(current)}function scan(){document.querySelectorAll('.companies-carousel').forEach(setup)}const app=document.querySelector('#app');if(app)new MutationObserver(scan).observe(app,{childList:true,subtree:true});scan()})();</script>
